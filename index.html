<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>TileKit – free sample</title>
<style>body{font:15px system-ui;margin:0;background:#fafafa;color:#222}header{padding:28px 20px;max-width:900px;margin:auto}h1{margin:0 0 6px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;max-width:900px;margin:auto;padding:0 20px 40px}.g div{height:170px;border-radius:8px;border:1px solid #0002}figcaption{font-size:12px;color:#666}figure{margin:0}</style>
<header><h1>TileKit – free sample</h1><p>13 seamless vector tiles in the “sunset” palette, free for any use (MIT). The full pack has 130 tiles: 13 designs × 10 palettes.</p></header><div class=g id=g></div>
<script>for(const k of "dots stripes waves scales plaid argyle confetti hex chevron rings plus checker terrazzo".split(" "))g.insertAdjacentHTML("beforeend",`<figure><div style="background:url(svg/${k}-sunset.svg) 0 0/100px auto"></div><figcaption>${k}-sunset.svg</figcaption></figure>`)</script>
